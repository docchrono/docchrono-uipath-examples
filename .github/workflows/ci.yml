name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the bridge and development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Verify deterministic synthetic fixtures
        run: python scripts/generate_synthetic_data.py --check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: npx --yes pyright@1.1.413 src tests scripts
      - name: Test bridge and expected outputs
        run: python -m pytest -q

  uipath:
    name: UiPath XAML
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned UiPath CLI
        run: npm install --global @uipath/cli@1.197.1
      - name: Verify pinned UiPath CLI configuration
        shell: pwsh
        run: |
          uip --version
          uip config get autoVersionSync --output json
          uip config get version --output json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the bridge
        run: python -m pip install .
      - name: Validate and build the UiPath project
        shell: pwsh
        run: ./scripts/validate_uipath.ps1
      - name: Run all five UiPath examples
        shell: pwsh
        run: ./scripts/run_uipath_project.ps1 -PythonExecutable (Get-Command python).Source
      - name: Reject unsafe response envelopes
        shell: pwsh
        run: ./scripts/test_uipath_response_validation.ps1 -PythonExecutable (Get-Command python).Source
      - name: Verify UiPath package contents
        shell: pwsh
        run: ./scripts/validate_uipath_package.ps1
