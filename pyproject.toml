[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "docchrono-uipath-bridge-examples"
version = "0.1.0"
description = "A deterministic JSON bridge showing how UiPath can use DocChrono"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "DocChrono contributors" }]
keywords = ["docchrono", "uipath", "rpa", "chronology", "evidence-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "docchrono==0.1.0",
  "beautifulsoup4==4.15.0",
  "dateparser==1.4.2",
  "networkx==3.6.1",
  "pdfplumber==0.11.10",
  "pydantic==2.13.5",
  "python-docx==1.2.0",
  "lxml==6.1.2",
  "rapidfuzz==3.14.6",
  "spacy==3.8.16",
]

[project.urls]
Documentation = "https://github.com/docchrono/docchrono-uipath-examples#readme"
Issues = "https://github.com/docchrono/docchrono-uipath-examples/issues"
Repository = "https://github.com/docchrono/docchrono-uipath-examples"

[tool.hatch.build.targets.wheel]
packages = ["src/docchrono_uipath_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
